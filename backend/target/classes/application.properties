# ==============================================================================
# Smart Building Energy Management System - Application Configuration
# ==============================================================================
server.port=8080
server.servlet.context-path=/api

# ----------------- Database Configuration (MySQL) -----------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_energy_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------- JPA / Hibernate -----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----------------- JWT Security Config -----------------
# 256-bit secure secret key
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ----------------- FastAPI AI Service Integration -----------------
ai.service.base-url=http://localhost:8000
ai.service.predict-endpoint=/predict
ai.service.recommendations-endpoint=/recommendations

# ----------------- Energy Tariff & System Defaults -----------------
energy.tariff.rate-per-kwh=8.0
energy.reports.storage-dir=./reports_storage/
