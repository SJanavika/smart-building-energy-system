databases:
  - name: smart-building-energy-db
    databaseName: smart_energy_db
    user: smart_energy_user
    plan: free
    region: ohio

services:
  - type: web
    name: smart-building-energy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: APP_JWT_SECRET
        generateValue: true
      - key: DATABASE_HOST
        fromDatabase:
          name: smart-building-energy-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: smart-building-energy-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: smart-building-energy-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: smart-building-energy-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: smart-building-energy-db
          property: password
      - key: AI_SERVICE_HOST
        fromService:
          type: web
          name: smart-building-energy-system
          property: host
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://smart-building-energy-frontend.onrender.com,http://localhost:3000,http://localhost:5173

  - type: web
    name: smart-building-energy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: smart-building-energy-api.onrender.com
